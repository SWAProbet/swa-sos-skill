name: server checks

on:
  pull_request:
    paths: ["server/**", ".github/workflows/server-checks.yml"]
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server-checks.yml"]

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      # Full history: the line check diffs against the commit this one builds on.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - name: 79-column limit on changed lines
        run: npm run lint:lines
